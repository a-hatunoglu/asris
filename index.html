<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Asris: sıraları kaydır, noktaları temizle. Satranç gibi öğrenilen bir mantık bulmacası.">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EEF2F8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asris">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Asris</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
/* Asris — görsel dil: minimal laboratuvar */
:root {
  --bg: #EEF2F8; --surface: #FFFFFF; --surface2: #E4EAF3; --line: #CBD5E3; --text: #0F1A30; --muted: #5B6B86;
  --blue: #1F6FE0; --blue-soft: rgba(31,111,224,.16); --red: #D9481C; --red-soft: rgba(217,72,28,.16); --gold: #B8860B; --gold-soft: rgba(184,134,11,.18);
  --accent: #1F6FE0; --accent-text: #FFFFFF; --cell: #F7F9FC; --cell-empty: #EEF2F8; --handle: #DDE5F0; --grip: #8E9DB5; --shadow: 0 12px 30px rgba(15,26,48,.18);
  --good: #1B8A5A; --warn: #B8860B; --danger: #C43D2D; --radius: 14px;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0B1220; --surface: #121B2E; --surface2: #182338; --line: #263350; --text: #E6ECF7; --muted: #8E9DB8; --blue: #4FA3FF; --blue-soft: rgba(79,163,255,.18); --red: #FF7A45; --red-soft: rgba(255,122,69,.18); --gold: #D4AF37; --gold-soft: rgba(212,175,55,.2); --accent: #4FA3FF; --accent-text: #061024; --cell: #172238; --cell-empty: #121B2E; --handle: #1D2A44; --grip: #5C6E92; --shadow: 0 14px 34px rgba(0,0,0,.5); --good: #3DD68C; --warn: #E2B93B; --danger: #FF6B5B; color-scheme: dark; } }
:root[data-theme="dark"], #app[data-theme="dark"] { --bg: #0B1220; --surface: #121B2E; --surface2: #182338; --line: #263350; --text: #E6ECF7; --muted: #8E9DB8; --blue: #4FA3FF; --blue-soft: rgba(79,163,255,.18); --red: #FF7A45; --red-soft: rgba(255,122,69,.18); --gold: #D4AF37; --gold-soft: rgba(212,175,55,.2); --accent: #4FA3FF; --accent-text: #061024; --cell: #172238; --cell-empty: #121B2E; --handle: #1D2A44; --grip: #5C6E92; --shadow: 0 14px 34px rgba(0,0,0,.5); --good: #3DD68C; --warn: #E2B93B; --danger: #FF6B5B; color-scheme: dark; }
#app[data-theme="light"] { --bg: #EEF2F8; --surface: #FFFFFF; --surface2: #E4EAF3; --line: #CBD5E3; --text: #0F1A30; --muted: #5B6B86; --blue: #1F6FE0; --blue-soft: rgba(31,111,224,.16); --red: #D9481C; --red-soft: rgba(217,72,28,.16); --gold: #B8860B; --gold-soft: rgba(184,134,11,.18); --accent: #1F6FE0; --accent-text: #FFFFFF; --cell: #F7F9FC; --cell-empty: #EEF2F8; --handle: #DDE5F0; --grip: #8E9DB5; --shadow: 0 12px 30px rgba(15,26,48,.18); --good: #1B8A5A; --warn: #B8860B; --danger: #C43D2D; color-scheme: light; }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; overscroll-behavior-y: contain; }
#app { min-height: 100%; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 640px; margin: 0 auto; padding-inline: 16px; box-sizing: border-box; padding-block: 0 24px; }
.screen[hidden] { display: none; }
button { font: inherit; color: inherit; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 12px; padding: 12px 18px; cursor: pointer; font-weight: 600; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform .08s ease, background .15s ease; min-height: 48px; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.btn.danger { color: var(--danger); }
.btn.big { padding: 16px 22px; font-size: 18px; width: 100%; }
.btn small { font-weight: 400; font-size: 13px; opacity: .85; }
.btn .ico { width: 18px; height: 18px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 14px; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* üst çubuk */
.bar { display: flex; align-items: center; gap: 10px; padding-block: 10px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; min-height: 56px; }
.bar-title { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.bar-title b { font-size: 17px; } .bar-title small { color: var(--muted); font-size: 12.5px; }
.bar-spacer { flex: 1; }
.bar-meta { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.bar-title small { white-space: nowrap; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.goal { width: 48px; flex: none; }
.goal .mini { width: 48px; height: 48px; }
.stars .star { color: var(--line); font-size: 15px; transition: color .2s, transform .2s; }
.stars .star.on { color: var(--gold); }
.star.pop { animation: starpop .45s ease; }
@keyframes starpop { 0% { transform: scale(.4); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }

/* ana ekran */
.home { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding-block: 24px; }
.logo-svg { width: min(280px, 70vw); height: auto; display: block; margin: 0 auto; }
.logo-cells rect { fill: var(--cell); stroke: var(--line); }
.logo-cells .lb { fill: var(--blue); } .logo-cells .lr { fill: none; stroke: var(--red); stroke-width: 3; }
.logo-text { font-family: var(--sans); font-weight: 700; font-size: 44px; fill: var(--text); letter-spacing: -.5px; }
.tagline { text-align: center; color: var(--muted); margin: 0; }
.home-actions { display: flex; flex-direction: column; gap: 12px; }
.row-btns { display: flex; gap: 10px; } .row-btns .btn { flex: 1; }
.home-stars { text-align: center; color: var(--muted); margin: 0; font-size: 14px; }

/* harita */
.map { display: flex; flex-direction: column; gap: 22px; padding-block: 8px; }
.phase h2 { font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.lvl { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 8px 8px; min-height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; }
.lvl.locked { opacity: .45; cursor: default; }
.lvl.open { border-color: var(--accent); box-shadow: 0 0 0 3px var(--blue-soft); }
.lvl.done { background: var(--surface2); }
.lvl-no { font-weight: 700; font-size: 20px; }
.lvl-stars { color: var(--gold); font-size: 13px; letter-spacing: 1px; min-height: 16px; }
.lvl-size { color: var(--muted); font-size: 11.5px; }
.lvl-mark { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-text); font-size: 10.5px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
.watched { font-size: 13px; }

/* oyun ekranı */
#screen-play { padding-block: 0 0; }
.play-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-block: 8px 12px; }
#board-wrap { width: 100%; max-width: 600px; }
.board { width: 100%; height: auto; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; overflow: visible; }
.board.static .row { cursor: default; }
.row { cursor: grab; }
.row.dragging { cursor: grabbing; }
.row.dragging { opacity: .92; }
.row.dragging .cell-bg, .row.dragging .handle-bg { filter: drop-shadow(0 10px 14px rgba(0,0,0,.35)); stroke: var(--accent); }
.row.dragging .flip { opacity: 0; }
.row.ghost-lift .cell-bg { filter: drop-shadow(0 8px 10px rgba(0,0,0,.25)); }
.cell-bg { fill: var(--cell); stroke: var(--line); stroke-width: 1.5; transition: fill .15s, stroke .15s; }
.cell.empty .cell-bg { fill: var(--cell-empty); }
.target { fill: none; stroke: var(--gold); stroke-width: 2; stroke-dasharray: 7 5; opacity: .85; }
.cell.lit .cell-bg { fill: var(--gold-soft); stroke: var(--gold); }
.dot.blue { fill: var(--blue); }
.dot.red { fill: none; stroke: var(--red); stroke-width: 4.5; }
.dot.ghost { opacity: .45; }
.dot.in { animation: dotin .28s cubic-bezier(.2,.9,.3,1.3); transform-box: fill-box; transform-origin: center; }
@keyframes dotin { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.num { font-family: var(--mono); font-size: 40px; font-weight: 500; fill: var(--text); pointer-events: none; }
.num-small { font-family: var(--mono); font-size: 17px; fill: var(--muted); pointer-events: none; }
.handle-bg { fill: var(--handle); stroke: var(--line); stroke-width: 1.5; }
.grip { fill: var(--grip); }
.swap-bg { fill: var(--accent); }
.swap-arrow { fill: var(--accent-text); }
.row.hot .cell-bg { stroke: var(--accent); stroke-width: 2.5; }
.row.illegal .cell-bg, .row.illegal .half-bg { stroke: var(--danger); }
.half-bg { fill: var(--blue-soft); stroke: transparent; stroke-width: 2.5; opacity: .5; }
.half.active .half-bg { opacity: 1; stroke: var(--accent); }
.minus .half-bg { fill: var(--red-soft); } .minus.active .half-bg { stroke: var(--red); }
.half-label { font-family: var(--mono); font-size: 34px; font-weight: 500; fill: var(--text); opacity: .45; }
.half.active .half-label { opacity: .9; }
.flip { cursor: pointer; }
.flip-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: fill .15s; }
.flip:hover .flip-bg, .flip:active .flip-bg { fill: var(--surface2); }
.flip-label { font-family: var(--mono); font-size: 30px; fill: var(--text); pointer-events: none; }
.flip.hint-flip .flip-bg { fill: var(--accent); stroke: var(--accent); animation: pulse 1s ease-in-out infinite; }
.flip.hint-flip .flip-label { fill: var(--accent-text); }
.row.hint-src .cell-bg, .row.hint-src .handle-bg { stroke: var(--accent); stroke-width: 3; animation: pulse 1.1s ease-in-out infinite; }
.row.hint-dst .cell-bg { stroke: var(--gold); stroke-width: 2.5; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
.bracket { fill: none; stroke: var(--text); stroke-width: 3.5; stroke-linecap: round; opacity: .8; transition: opacity .4s; }
.board.reveal .bracket { animation: draw 1.2s ease forwards; stroke-dasharray: 800; stroke-dashoffset: 800; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.pop { fill: none; stroke: var(--gold); stroke-width: 3; }
.beam { fill: var(--gold); }
.hand-tip { fill: var(--text); opacity: .55; }
.hand-ring { fill: none; stroke: var(--text); stroke-width: 3; opacity: .5; }
.caption { margin: 0; color: var(--muted); font-size: 14.5px; text-align: center; max-width: 36ch; }
.bottombar { display: flex; gap: 8px; padding-block: 8px calc(10px + env(safe-area-inset-bottom, 0px)); position: sticky; bottom: 0; background: var(--bg); }
.tool { flex: 1; min-height: 56px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; cursor: pointer; color: var(--text); }
.tool:disabled { opacity: .4; cursor: default; }
.tool.accent { border-color: var(--accent); color: var(--accent); }
.tool.pulse { animation: pulse .8s ease-in-out 3; border-color: var(--warn); }
.tool.loading { opacity: .6; }

/* mini tahtalar */
.mini { width: 100%; max-width: 120px; height: auto; display: block; }
.mini.big { max-width: 200px; margin: 0 auto; }
.mini-cell { fill: var(--cell); stroke: var(--line); }
.mini-cell.diag { stroke: var(--gold); stroke-dasharray: 3 2; }
.mini-blue { fill: var(--blue); } .mini-red { fill: none; stroke: var(--red); stroke-width: 1.8; }

/* günlük */
.daily { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding-block: 16px; }
.daily-preview { width: 100%; max-width: 220px; }
.daily-res { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.big-stars .star { font-size: 30px; }

/* ayarlar */
.settings { display: flex; flex-direction: column; gap: 14px; padding-block: 8px; }
.set-row { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.set-row label { font-weight: 600; display: flex; flex-direction: column; gap: 2px; }
.set-row label small { font-weight: 400; color: var(--muted); font-size: 13px; }
.segs { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 600; min-height: 40px; }
.seg.on { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.code { width: 100%; box-sizing: border-box; font-family: var(--mono); font-size: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); padding: 8px; resize: vertical; }
.about { color: var(--muted); font-size: 14px; text-align: center; }

/* modallar */
#modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
#modal[hidden] { display: none; }
.modal-back { position: absolute; inset: 0; background: rgba(5,10,20,.55); backdrop-filter: blur(2px); }
.modal-card { position: relative; background: var(--surface); color: var(--text); border-radius: 22px 22px 0 0; padding: 22px 20px calc(20px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 560px; box-shadow: var(--shadow); box-sizing: border-box; max-height: 88vh; overflow: auto; animation: rise .28s cubic-bezier(.2,.9,.3,1); }
@media (min-width: 640px) { #modal { align-items: center; padding: 20px; } .modal-card { border-radius: 22px; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-card h2 { margin: 0 0 8px; font-size: 22px; text-wrap: balance; }
.modal-card p { margin: 0 0 12px; white-space: pre-line; }
.modal-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.modal-actions .btn { flex: 1; min-width: 120px; }
.modal-actions.center { justify-content: center; }
.lab-head { text-align: center; }
.lab-stars .star { font-size: 34px; }
.chips { display: flex; gap: 8px; justify-content: center; margin: 6px 0 10px; }
.chip { background: var(--surface2); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
.chip.accent { background: var(--blue-soft); color: var(--accent); }
.intro { background: var(--gold-soft); border-left: 3px solid var(--gold); padding: 10px 12px; border-radius: 8px; font-size: 15px; }
.moves summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.moves ol { margin: 8px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
.moves li small { display: block; color: var(--muted); font-size: 12.5px; }
.reveal-title { font-size: 26px; }
.view-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0; }
.view-opt { border: 1px solid var(--line); background: var(--surface2); border-radius: 14px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
.view-opt:hover { border-color: var(--accent); }
.view-opt .mini { max-width: 84px; }
.small-nums { font-size: 12px; color: var(--muted); font-weight: 400; }
.matrix-pre { font-family: var(--mono); font-size: 18px; margin: 0; line-height: 1.35; padding: 6px 10px; border-left: 3px solid var(--text); border-right: 3px solid var(--text); border-radius: 6px; display: inline-block; }
.inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: center; margin: 8px 0; }
.inv-grid small { display: block; color: var(--muted); margin-bottom: 6px; }
.help-list { padding-left: 20px; display: flex; flex-direction: column; gap: 8px; margin: 8px 0 12px; }
#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 30; opacity: 0; transition: opacity .25s, transform .25s; max-width: calc(100% - 40px); text-align: center; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
body.modal-open { overflow: hidden; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; } }
@media (max-width: 400px) { .bar-title b { font-size: 15px; } .bar-title small { font-size: 11.5px; } .bar-meta { font-size: 11.5px; } .goal, .goal .mini { width: 40px; height: 40px; } .num { font-size: 36px; } .tool { font-size: 11px; min-height: 52px; } .view-grid { grid-template-columns: 1fr; } }

</style>
</head>
<body>
<div id="app">
  <main id="screen-home" class="screen"></main>
  <main id="screen-map" class="screen" hidden></main>
  <main id="screen-play" class="screen" hidden></main>
  <main id="screen-daily" class="screen" hidden></main>
  <main id="screen-settings" class="screen" hidden></main>
  <div id="modal" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

    return p;
  }
  // ---- ayarlar ----
  function renderSettings() {
    const el = $('#screen-settings'), st = A.store.get();
    const opt = (name, val, label, cur) => `<button class="seg ${cur === val ? 'on' : ''}" data-set="${name}" data-val="${val}" aria-pressed="${cur === val}">${esc(label)}</button>`;
    el.innerHTML = `<header class="bar"><button class="icon-btn" id="set-back" aria-label="${esc(t('back'))}">${icon('back')}</button><div class="bar-title"><b>${esc(t('settings'))}</b></div><span class="bar-spacer"></span></header>
    <div class="settings">
      <div class="set-row"><label>${esc(t('settingsLang'))}</label><div class="segs">${opt('lang', 'tr', t('lang_tr'), st.lang)}${opt('lang', 'en', t('lang_en'), st.lang)}</div></div>
      <div class="set-row"><label>${esc(t('settingsView'))}</label><div class="segs">${opt('view', 'dots', t('viewDots'), st.unlockedView ? st.view : 'dots')}${opt('view', 'numbers', t('viewNumbers'), st.unlockedView ? st.view : '')}${opt('view', 'matrix', t('viewMatrix'), st.unlockedView ? st.view : '')}</div></div>
      <div class="set-row"><label>${esc(t('settingsNotation'))}<small>${esc(t('settingsNotationNote'))}</small></label><div class="segs">${opt('notation', '0', t('off'), st.notation ? '1' : '0')}${opt('notation', '1', t('on'), st.notation ? '1' : '0')}</div></div>
      <div class="set-row"><label>${esc(t('settingsSound'))}</label><div class="segs">${opt('sound', '0', t('off'), st.sound ? '1' : '0')}${opt('sound', '1', t('on'), st.sound ? '1' : '0')}</div></div>
      <div class="set-row"><label>${esc(t('settingsTheme'))}</label><div class="segs">${opt('theme', 'auto', t('themeAuto'), st.theme)}${opt('theme', 'dark', t('themeDark'), st.theme)}${opt('theme', 'light', t('themeLight'), st.theme)}</div></div>
      <div class="set-row"><label>${esc(A.pwa.isMobile() ? t('settingsInstall') : t('settingsInstallDesktop'))}<small>${esc(t('installBody'))}</small></label><button class="btn" id="set-install">${esc(A.pwa.installed() ? t('installed') : (A.pwa.isMobile() ? t('settingsInstall') : t('settingsInstallDesktop')))}</button></div>
      <div class="set-row"><label>${esc(t('progressTitle'))}<small>${esc(t('progressBody'))}</small></label><div class="segs"><button class="btn" id="set-export">${esc(t('progressCopy'))}</button><button class="btn" id="set-import">${esc(t('progressPaste'))}</button></div><textarea id="set-code" class="code" rows="3" hidden placeholder="ASRIS1.…"></textarea><div id="set-import-actions" hidden><button class="btn primary" id="set-import-go">${esc(t('progressImport'))}</button></div></div>
      <div class="set-row"><label>${esc(t('progressReset'))}</label><button class="btn danger" id="set-reset">${esc(t('progressReset'))}</button></div>
      <p class="about">${esc(t('about'))}<br><small>${esc(t('version'))} ${A.config.version}</small></p>
    </div>`;
    $('#set-back').onclick = () => show('home');
    el.querySelectorAll('.seg').forEach(b => b.onclick = () => {
      const k = b.dataset.set, v = b.dataset.val;
      A.store.set(s => { if (k === 'lang') s.lang = v; if (k === 'view') { s.view = v; s.unlockedView = true; } if (k === 'notation') s.notation = v === '1'; if (k === 'sound') s.sound = v === '1'; if (k === 'theme') s.theme = v; });
      A.main.applySettings(); renderSettings(); A.audio.play('tap');
    });
    $('#set-install').onclick = () => A.pwa.offer(true);
    $('#set-export').onclick = async () => { const code = A.store.exportCode(); const ta = $('#set-code'); ta.hidden = false; ta.value = code; $('#set-import-actions').hidden = true; try { await navigator.clipboard.writeText(code); toast(t('dailyCopied')); } catch (e) { ta.select(); } };
    $('#set-import').onclick = () => { const ta = $('#set-code'); ta.hidden = false; ta.value = ''; ta.placeholder = 'ASRIS1.…'; $('#set-import-actions').hidden = false; ta.focus(); };
    $('#set-import-go').onclick = () => { const ok = A.store.importCode($('#set-code').value); toast(t(ok ? 'progressImported' : 'progressBad')); if (ok) { A.main.applySettings(); renderSettings(); } };
    $('#set-reset').onclick = async () => { if (await confirm(t('progressResetConfirm'), t('yesReset'), t('cancel'))) { A.store.resetAll(); A.main.applySettings(); show('home'); } };
  }
  // ---- dil seçimi (ilk açılış) ----
  function langPicker() {
    const p = openModal(`<h2>${esc(t('chooseLang'))}</h2><div class="modal-actions center"><button class="btn primary big" id="l-tr">Türkçe</button><button class="btn primary big" id="l-en">English</button></div>`, { cls: 'wide nolose' });
    bind('#l-tr', 'tr'); bind('#l-en', 'en'); return p;
  }
  // ---- toast ----
  let toastT = null;
  function toast(msg, ms) { const el = $('#toast'); el.textContent = msg; el.hidden = false; el.classList.add('show'); if (toastT) clearTimeout(toastT); toastT = setTimeout(() => { el.classList.remove('show'); setTimeout(() => { el.hidden = true; }, 300); }, ms || 2600); }
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#modal').hidden && !$('#modal .nolose')) closeModal(null); });
  $('#modal').addEventListener('click', ev => { if (ev.target.classList.contains('modal-back') && !$('#modal .nolose')) closeModal(null); });
  A.ui = { show, current: () => current, buildPlay, card, confirm, viewChoice, inverseCard, labCard, help, dailyResult, langPicker, toast, miniBoard, closeModal, renderHome };
})(window.Asris = window.Asris || {});

/* Asris — ana ekrana / masaüstüne ekleme ve çevrimdışı önbellek */
(function (A) {
  'use strict';
  const t = k => A.i18n.t(k);
  let deferred = null;
  window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); deferred = ev; });
  window.addEventListener('appinstalled', () => { deferred = null; A.ui.toast(t('installed')); });
  const ua = navigator.userAgent || '';
  const isIOS = () => /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isMobile = () => isIOS() || /Android/i.test(ua);
  const installed = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  async function offer(explicit) {
    if (installed()) { if (explicit) A.ui.toast(t('installed')); return; }
    if (deferred) {
      try { deferred.prompt(); const r = await deferred.userChoice; if (r && r.outcome === 'accepted') deferred = null; return; } catch (e) { /* devam */ }
    }
    const body = isIOS() ? t('installIos') : isMobile() ? t('installDesktopHelp') : t('installDesktopHelp');
    const inFrame = window.top !== window.self;
    await A.ui.card({ title: isMobile() ? t('settingsInstall') : t('settingsInstallDesktop'), body: t('installBody') + '\n\n' + (inFrame ? t('installUnavailable') : body), primary: t('ok') });
  }
  function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    if (!/^https?:$/.test(location.protocol) || window.top !== window.self) return;
    if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* çevrimdışı desteği isteğe bağlı */ }); });
  }
  A.pwa = { offer, isMobile, isIOS, installed, registerSW };
})(window.Asris = window.Asris || {});

/* Asris — açılış, ayarlar, klavye, tema */
(function (A) {
  'use strict';
  const $ = s => document.querySelector(s);
  function applySettings() {
    const st = A.store.get();
    A.i18n.setLang(st.lang || 'tr');
    A.audio.setEnabled(st.sound !== false);
    const app = $('#app'); app.dataset.theme = st.theme === 'auto' ? '' : st.theme;
    if (!st.theme || st.theme === 'auto') app.removeAttribute('data-theme');
    A.ui.buildPlay(); A.play.remount();
  }
  // klavye: Ctrl+Z, R, H, 1-3 + − S F
  let kbSrc = null, kbDst = null;
  function kbClear() { kbSrc = kbDst = null; const b = A.play.board; if (b) b.clearHints(); }
  document.addEventListener('keydown', ev => {
    if (A.ui.current() !== 'play' || !$('#modal').hidden) return;
    const tag = (ev.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea') return;
    const s = A.play.current(); if (!s || s.finished) return;
    const b = A.play.board, n = b.board.length, k = ev.key;
    if ((ev.ctrlKey || ev.metaKey) && k.toLowerCase() === 'z') { ev.preventDefault(); A.play.undo(); kbClear(); return; }
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (k === 'r' || k === 'R') { A.play.reset(); kbClear(); return; }
    if (k === 'h' || k === 'H') { A.play.hint(); kbClear(); return; }
    if (k === 'Escape') { kbClear(); return; }
    if (/^[1-9]$/.test(k)) { const i = +k - 1; if (i >= n) return; if (kbSrc === null || i === kbSrc) { kbSrc = i; kbDst = null; b.hintRow(i); A.ui.toast(A.i18n.t('keyboardPick', { a: i + 1, n }), 1800); } else { kbDst = i; b.hintMove({ t: 'add', i: kbSrc, j: kbDst }); A.ui.toast(A.i18n.t('keyboardOp', { a: kbSrc + 1, b: kbDst + 1 }), 1800); } return; }
    if (kbSrc === null) return;
    if (k === 'f' || k === 'F') { A.play.makeMove({ t: 'neg', i: kbSrc, j: kbSrc }); kbClear(); return; }
    if (kbDst === null) return;
    if (k === '+' || k === '=') { A.play.makeMove({ t: 'add', i: kbSrc, j: kbDst }); kbClear(); }
    else if (k === '-' || k === '_') { A.play.makeMove({ t: 'sub', i: kbSrc, j: kbDst }); kbClear(); }
    else if (k === 's' || k === 'S') { A.play.makeMove({ t: 'swap', i: Math.min(kbSrc, kbDst), j: Math.max(kbSrc, kbDst) }); kbClear(); }
  });
  document.addEventListener('pointerdown', () => A.audio.unlock(), { once: true, capture: true });
  async function boot() {
    const st = A.store.get();
    if (!st.lang) {
      const nav = (navigator.language || 'tr').toLowerCase().startsWith('tr') ? 'tr' : 'en';
      A.i18n.setLang(nav); A.ui.buildPlay();
      const l = await A.ui.langPicker(); A.store.set(s => { s.lang = l || nav; });
    }
    applySettings();
    A.ui.show('home');
    A.pwa.registerSW();
    // mesafe tablosunu boşta önceden getir (ipucu için)
    const idle = window.requestIdleCallback || (f => setTimeout(f, 1500));
    idle(() => { if (A.store.highestDone() >= 2) A.dist.load(); });
  }
  A.main = { applySettings, boot };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window.Asris = window.Asris || {});
